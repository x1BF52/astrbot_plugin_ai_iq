name: astrbot_plugin_ai_iq
display_name: AI 模型实时智商榜
short_desc: 一条指令查询全球主流 AI 模型的实时智商评分、API 价格、输出速度与首字延迟，渲染为分组配色卡片图。
desc: |
  查询全球主流 AI 模型（GPT / Gemini / Claude / DeepSeek / Qwen / GLM / Kimi / Grok 等 20+ 厂商、150+ 模型）的实时智商评分、API 输入/输出价格、输出速度与首字延迟，并以分组配色卡片图直观呈现，方便快速选模型干活。

  支持 `/aiiq` 总览、`/aiiq <厂商/关键词>` 筛选、`/aiiq 编程` 编程榜、`/aiiq 性价比` 性价比榜、`/aiiq 免费` 免费模型榜。
